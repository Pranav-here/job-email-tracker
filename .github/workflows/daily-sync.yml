name: Daily Job Email Sync

on:
  schedule:
    - cron: '0 14 * * *'  # 9am EST / 8am CST daily
  workflow_dispatch:        # allows manual trigger from GitHub UI

jobs:
  trigger-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets are set
        run: |
          if [ -z "${{ secrets.VERCEL_CRON_URL }}" ]; then
            echo "ERROR: VERCEL_CRON_URL secret is not set"
            exit 1
          fi
          if [ -z "${{ secrets.CRON_SECRET }}" ]; then
            echo "ERROR: CRON_SECRET secret is not set"
            exit 1
          fi
          echo "Secrets are configured"

      - name: Trigger cron endpoint
        run: |
          body=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -X POST "${{ secrets.VERCEL_CRON_URL }}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")
          http_status=$(echo "$body" | grep "HTTP_STATUS:" | cut -d: -f2)
          response_body=$(echo "$body" | grep -v "HTTP_STATUS:")
          echo "HTTP Status: $http_status"
          echo "Response body: $response_body"
          if [ "$http_status" != "200" ]; then
            echo "Sync failed with status $http_status"
            exit 1
          fi
          echo "Sync triggered successfully"
